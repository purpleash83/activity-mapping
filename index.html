<!DOCTYPE html>
<html>
	
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Testing - OSM | Leaflet | EPSG:</title>
	<link rel="stylesheet" href="style.css" >
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.4/dist/leaflet.css">
	<script type="importmap">
			{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.4/dist/leaflet.js"}}
	</script>	
</head>

<body>
	<div id="map"></div>
	<script type="module">
		const map = new LeafletMap('map').setView([55.951259, -3.200538], 6);
		
		new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
			maxZoom: 19,
			attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
		}).addTo(map);
	</script>
</body>
	
</html>
