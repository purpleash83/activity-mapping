<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
  	<meta http-equiv="X-UA-Compatible" content="IE=edge">
  	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  	<title>Activity Mapping | Leaflet | EPSG:</title>
	
	<!--Including leaflet in the application. Always load CSS file before JS file-->
	
	<link 
		rel="stylesheet" 
		href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""
	/>
	

	
	<style>
		#map {position: absolute; top: 0; bottom: 0; left: 0; right: 0;}
	</style>	
	
</head>

<body>

	<script 
		src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
	</script>

	  <script src="cycles.js"></script>
	
  	<!--Creating the map container and is always a <div>-->
  	<div id="map"></div>

 	<!--Script files goes at the bottom of the body section-->
 	<script>
    	var map = L.map('map', {
      		center: [55.64574450163974, -3.1371999102424577],
      		zoom: 20
    	});

    	// adding basemap to the map OTHER MAPS
    	var basemap = L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
     		attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors'
    	});
    	basemap.addTo(map);

	    //add a marker for the Glentress
        // Coordinates: 55.64574450163974, -3.1371999102424577
    	var marker = new L.marker([55.64574450163974, -3.1371999102424577]);
			marker.bindTooltip("<b>Glentress</b>", { });
        	marker.addTo(map);

    	// get colour depending on  activity
    	function getColor(d) {
      	return d = walk ? '#87F527' :
        	d = cycles ? '#F54927';
    }


    	// styling function for our GeoJSON layer, fillColor depends on feature.properties.PERCENTAGE property
    	function style(feature) {
      	return {
        	color: getColor(feature.properties.PERCENTAGE),
        	weight: 4,
        	opacity: 1,
      		};
    	}



		
		// styling function for cycles layer
    	//function style(feature) {
	    //return {
        	//color: "#F54927",
        	//weight: 4,
        	//opacity: 1
      		//};
    	//}
		
		// adding cycles and walks layers to the map
    	L.geoJson(cycles, { style: style }).addTo(map);
    	L.geoJson(walks, { style: style }).addTo(map);



		
        // Panes for map layer ordering
        //map.createPane("cyclesPane");
		

  </script>

</body>

</html>
