<head>

  	<title>Activity Mapping | Leaflet | EPSG:</title>
	
	<!--Including leaflet in the application. Always load CSS file before JS file-->
	
	<link

	<style>
		#map {position: absolute; top: 0; bottom: 0; left: 0; right: 0;}
	</style>	
	
</head>

<body>

	<script 
		src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

	</script>

	  <script src="cycles.js"></script>
	
  	<!--Creating the map container and is always a <div>-->
  	<div id="map"></div>

 	<!--Script files goes at the bottom of the body section-->
 	<script>
    	var map = L.map('map', {
      		center: [55.64574450163974, -3.1371999102424577],
      		zoom: 20
    	});

    	// adding basemap to the map OTHER MAPS
    	var basemap = L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
     		attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors'
    	});
    	basemap.addTo(map);

	    //add a marker for the Glentress
        // Coordinates: 55.64574450163974, -3.1371999102424577
    	var marker = new L.marker([55.64574450163974, -3.1371999102424577]);
			marker.bindTooltip("<b>Glentress</b>", { });
        	marker.addTo(map);

		// adding cycle layer to the map and styling it

         //       color: "F54927",
         //       weight: 1,
          //      fillOpacity: 0.2,
    	//		};
		//	}.addTo(map);

		// adding cycle layer to the map
    	L.geoJSON(cycles).addTo(map);
